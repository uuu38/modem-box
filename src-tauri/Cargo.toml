[package]
name = "modem-box"
version = "0.6.0"
description = "Cross-platform optical modem telemetry, credential vault, and security hardening desktop toolbox"
authors = ["uuu38"]
license = "MIT"
repository = "https://github.com/uuu38/modem-box"
readme = "../README.md"
keywords = ["tauri", "optical-modem", "gpon", "telnet", "network"]
categories = ["network-programming", "gui"]
edition = "2024"

[lib]
name = "modem_box_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "cookies"] }
regex = "1.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
