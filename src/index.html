<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>光猫全能工具箱 (Tauri 2.0)</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div class="app-layout">
      <!-- Header -->
      <header class="app-header">
        <h2>🛠️ 天邑/烽火光猫全能工具箱 v0.1.0</h2>
        <span class="badge" id="telnet-status-badge">Telnet 状态: 未检测</span>
      </header>

      <!-- Step 1: Web Auth -> Enable Telnet -->
      <section class="card config-card">
        <h3>第一步：输入光猫背面普通密码，一键开启 Telnet</h3>
        <div class="form-row" style="margin-top: 10px; align-items: flex-end;">
          <label>光猫 IP: <input type="text" id="ip" value="192.168.1.1" /></label>
          <label>Web 普通账号: <input type="text" id="web-user" value="user" /></label>
          <label>Web 普通密码: <input type="text" id="web-pass" placeholder="输入光猫背面普通用户密码" /></label>
          <button id="btn-enable-telnet" class="btn btn-primary" style="height: 36px;">🚀 一键开启 Telnet</button>
        </div>
      </section>

      <!-- Step 2: Telnet Credentials & Operations -->
      <section class="card action-card">
        <h3>第二步：Telnet 高级工具箱</h3>
        <div class="form-row" style="margin-top: 10px;">
          <label>Telnet 账号: <input type="text" id="user" value="CMCCAdmin" /></label>
          <label>Telnet 密码: <input type="text" id="pass" value="aDm8H%MdA" /></label>
        </div>
        <div class="button-grid">
          <button id="btn-test-telnet" class="btn btn-success">1. 测试 Telnet 握手与连接</button>
          <button id="btn-sys-info" class="btn btn-info">2. 读取系统硬件与链路状态</button>
          <button id="btn-credentials" class="btn btn-warning">3. 提取核心凭据 (LOID/宽带/超管)</button>
          <button id="btn-surveillance" class="btn btn-secondary">4. 运营商监控专项审计</button>
          <button id="btn-kill-surv" class="btn btn-danger">5. 一键停止 Java/DPI 监控释放内存</button>
        </div>
      </section>

      <!-- Custom Command -->
      <section class="card cmd-card">
        <div class="cmd-row">
          <input type="text" id="custom-cmd" placeholder="输入自定义 Shell 命令，例如: free -m 或 ifconfig" />
          <button id="btn-exec-cmd" class="btn btn-dark">执行指令</button>
        </div>
      </section>

      <!-- Output Display -->
      <section class="card output-card">
        <div class="output-header">
          <h3>📋 执行结果与数据输出</h3>
          <button id="btn-clear" class="btn btn-sm">清空</button>
        </div>
        <pre id="output-box">// 等待执行操作...</pre>
      </section>
    </div>
  </body>
</html>
