<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>光猫全能工具箱 (Tauri 2.0)</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div class="app-layout">
      <!-- Header -->
      <header class="app-header">
        <h2>🛠️ 天邑/烽火光猫全能工具箱 v0.2.0</h2>
        <span class="badge" id="telnet-status-badge">Telnet 状态: 未检测</span>
      </header>

      <!-- Step 1: Telnet Credentials & Enable -->
      <section class="card config-card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h3>⚡ Telnet 开启与账号密码配置</h3>
          <div style="display: flex; gap: 8px;">
            <button id="btn-reset-default" class="btn btn-sm btn-secondary" title="填入默认官方账号与密码">
              恢复默认 (aDm8H%MdA)
            </button>
            <button id="btn-enable-telnet" class="btn btn-primary" style="padding: 10px 18px; font-size: 14px;">
              🚀 一键开启 / 设置 Telnet
            </button>
          </div>
        </div>

        <div class="form-row" style="margin-top: 12px;">
          <label style="flex: 1;">光猫 IP: 
            <input type="text" id="ip" value="192.168.1.1" />
          </label>
          <label style="flex: 1;">Telnet 账号: 
            <input type="text" id="user" value="CMCCAdmin" placeholder="例如: CMCCAdmin" />
          </label>
          <label style="flex: 1.5;">Telnet 密码 (支持自定义): 
            <input type="text" id="pass" value="aDm8H%MdA" placeholder="必须大于8位，含字母、数字、特殊字符" />
          </label>
        </div>
        <div id="pwd-hint" style="font-size: 12px; margin-top: 6px; color: #94a3b8;">
          💡 密码要求：必须同时包含字母、数字和特殊字符，不含空格，长度必须大于 8 位（至少 9 位）。
        </div>
      </section>

      <!-- Step 2: Advanced Toolbox -->
      <section class="card action-card">
        <h3>🧰 光猫高级功能区</h3>
        <div class="button-grid">
          <button id="btn-test-telnet" class="btn btn-success">1. 测试 Telnet 握手与连通性</button>
          <button id="btn-credentials" class="btn btn-warning">2. 提取核心凭据 (宽带/超管/GPON密码)</button>
          <button id="btn-sys-info" class="btn btn-info">3. 读取系统硬件、CPU 与内存信息</button>
          <button id="btn-surveillance" class="btn btn-secondary">4. 运营商流控监控审计 (DPI/Andlink)</button>
          <button id="btn-kill-surv" class="btn btn-danger">5. 一键停止 Java/DPI 监控释放内存</button>
        </div>
      </section>

      <!-- Custom Command -->
      <section class="card cmd-card">
        <div class="cmd-row">
          <input type="text" id="custom-cmd" placeholder="输入自定义 Shell 命令，例如: free -m 或 ps | grep java" />
          <button id="btn-exec-cmd" class="btn btn-dark">执行指令</button>
        </div>
      </section>

      <!-- Output Display -->
      <section class="card output-card">
        <div class="output-header">
          <h3>📋 执行结果与数据输出</h3>
          <button id="btn-clear" class="btn btn-sm">清空日志</button>
        </div>
        <pre id="output-box">// 点击上方“🚀 一键开启 / 设置 Telnet”开始...</pre>
      </section>
    </div>
  </body>
</html>
